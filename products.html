<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>productos</title>
    <!-- build:css css/main.css -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- endbuild -->
</head>

<body>
    <!-- build:js js/main.js -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/popper.js/umd/popper.min.js"></script>
    <!-- endbuild -->
    <nav class="navbar navbar-expand-lg" id="navbarStyles">
        <div class="container-fluid">
            <a class="navbar-brand textMain fw-bold" href="#">La fabrica de la empanada</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link  textMain fw-semibold" aria-current="page" href="./index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active textMain fw-semibold" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" href="#">Inventario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link textMain fw-semibold" aria-disabled="true">Contabilidad</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="">
       <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#addProd">Agregar</button>
    </div>
    <div class="modal fade" id="addProd" tabindex="-1" role="dialog" aria-labelledby="modalAdd" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAdd">Agregar un producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="form-group">
                            <label for="names-rs" class="col-form-label">nombre del producto:</label>
                            <input type="text" class="form-control" id="names-rs">
                            <label for="precio-rs" class="col-form-label">precio del producto:</label>
                            <input type="number" class="form-control" id="precio-rs">
                            <label for="imagen-rs" class="col-form-label">url imagen:</label>
                            <input type="text" class="form-control" id="imagen-rs">
                            <label for="description-rs" class="col-form-label">descripcion:</label>
                            <input type="text" class="form-control" id="description-rs">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success">Enviar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>

    </script>
</body>

</html>
