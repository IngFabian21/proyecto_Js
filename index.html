<body>

            <div class="collapse navbar-collapse" id="navbarNav">

    <button class="btn btn-dark" id="addUserBtn"> add user</button>
    <div id="user-list"></div>

    <script>
        // Esperar a que la página cargue
        window.onload = function () {
            fetch('https://dummyjson.com/users') // Cambia esta URL por la real
                .then(response => response.json())
                .then(data => {
                    const users = data.users; // Ajusta según la estructura de tu respuesta
                    const userList = document.getElementById('user-list');

                    users.forEach(user => {
                        const userCard = document.createElement('div');
                        userCard.textContent = `${user.id} - ${user.firstName} ${user.lastName}`;
                        userCard.style.border = '1px solid gray';
                        userCard.style.padding = '10px';
                        userCard.style.margin = '5px 0';
                        userList.appendChild(userCard);
                    });
                })
            /*fetch('https://dummyjson.com/users/2', {
                method: 'PATCH', //tambien se puede usar PUT
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: 'Fabian',
                    lastName: 'Rodr'
                }),
            }).then((response) => response.json()).then((data) => console.log(data))*/

            /*fetch('https://dummyjson.com/users/2', {
                method: 'DELETE'
            }).then((response) => response.json()).then((data) => console.log(data))
            .catch((error) => console.log(error));*/

            const deleteUser = async () => {
               try {
                const response = await fetch('https://dummyjson.com/users/0',{
                    method: 'DELETE',
                })
                const data= await response.json();
                if(response.ok){
                    console.log(data)
                } else {
                    throw new Error(data.message);
                }
                
               } catch (error) {
                    alert(error);
               }
            }
            deleteUser();

            }).then(async(response) => {

                    throw new Error(errData.message);
                }
            })
            .then((data) => console.log(data))
            .catch((error) => alert(error));*/

            const button = document.getElementById('addUserBtn');
            button.addEventListener('click', () => {
                fetch('https://dummyjson.com/users/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName: 'Fabian',
                        lastName: 'Rodr'
                    }),
                }).then((response) => response.json()).then((data) => console.log(data))
            })


        };
    </script>
